<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <style>
    /* Monocromo adaptativo: en modo claro tile negro con glifo blanco;
       en modo oscuro se invierte (tile blanco con glifo negro). */
    .tile { fill: #0a0a0a; }
    .glyph { fill: #fafafa; }
    .edge { stroke: #fafafa; stroke-opacity: 0.25; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #fafafa; }
      .glyph { fill: #0a0a0a; }
      .edge { stroke: #0a0a0a; stroke-opacity: 0.25; }
    }
  </style>
  <rect class="tile" width="64" height="6