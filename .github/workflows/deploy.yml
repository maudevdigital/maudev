name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main, develop]
  # Nota: el deploy de preview en pull_request se quitó porque fallaba con
  # "No ref found" al borrar la rama en el merge. Se dispara por push a una rama
  # estable, que no tiene ese problema: la rama nunca desaparece bajo el job.
  #
  # main    → producción (maudev.cl)
  # develop → preview en develop.maudev.pages.dev, sin tocar producción

  # Botón "Run workflow" en la pestaña Actions: vuelve a construir y desplegar
  # la rama elegida sin tener que inventar un commit.
  #
  # Hace falta cuando lo que cambió no está en el repo. El 21 de septiembre el
  # CLOUDFLARE_API_TOKEN dejó de autenticar y los deploys fallaban en el último
  # paso; al rotarlo no había forma de reintentar, porque el árbol estaba igual
  # que antes. Hubo que re-ejecutar a mano el run fallido desde la API.
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Webhook de n8n para los leads del formulario (Settings → Secrets).
          # Obligatoria y ahora crítica: ya no hay fallback y, desde que el hero
          # y el bloque de planes llevan al formulario, es el camino principal
          # de contacto del sitio. Si falta, /contacto falla explícitamente (ver
          # src/lib/leads.js) y solo queda el respaldo por WhatsApp del aviso de
          # error.
          VITE_LEAD_WEBHOOK_URL: ${{ secrets.VITE_LEAD_WEBHOOK_URL }}
          # Site key PÚBLICA de Turnstile. Si falta, el sitio no carga el widget
          # y funciona como siempre. Ojo con el orden: poner el secreto en el
          # worker sin esta variable deja todo envío en 403.
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
          # Número de WhatsApp del negocio. Opcional: sin ella se usa el valor
          # por defecto de src/lib/whatsapp.js, que es un número PERSONAL.
          #
          # Tiene que estar acá y no en el panel de Cloudflare: el build ocurre
          # en este runner y Vite congela las VITE_* en ese momento. Cloudflare
          # solo recibe el dist ya compilado, así que una variable definida allá
          # nunca llega al bundle.
          VITE_WHATSAPP_NUMBER: ${{ secrets.VITE_WHATSAPP_NUMBER }}

      # Las pruebas corren DESPUÉS del build porque validan el dist real
      # (validate-site levanta `vite preview` sobre él) y ANTES del deploy
      # porque, si fallan, el job se detiene y no se publica nada.
      #
      # Antes este workflow no corría ninguna: todo se validaba a mano en la
      # máquina de quien programaba, así que cualquier regresión llegaba a
      # producción sin que nada la frenara. Cubre rutas, hreflang, canonicals,
      # consentimiento por finalidad, coherencia de precios, el camino del
      # cotizador al formulario, la jerarquía de CTA y la CSP.
      - name: Instalar Chromium para el prerender y las validaciones
        run: |
          # `--with-deps` instala las librerias de sistema que pide Chromium, y
          # para eso corre `apt-get update`, que consulta TODOS los repos
          # configurados en la imagen del runner. El de packages.microsoft.com
          # (dotnet, powershell, azure-cli) no aporta ni una dependencia de
          # Chromium, pero si falla, apt sale con error y se cae el paso entero.
          #
          # Paso el 21 de septiembre: devolvio 403 Forbidden y tumbo el
          # despliegue completo con el sitio y el codigo intactos. Un repo de
          # terceros que no usamos no puede ser punto unico de falla del deploy.
          #
          # Quitar la lista solo evita que apt lo consulte en este job; no
          # desinstala nada y el runner es efimero.
          sudo rm -f /etc/apt/sources.list.d/microsoft*.list /etc/apt/sources.list.d/microsoft*.sources
          npx playwright install --with-deps chromium

      # El build deja el <head> de cada ruta pero el cuerpo vacio: todo lo pinta
      # React en el cliente. Este paso visita las 53 rutas con Chromium y guarda
      # el cuerpo ya renderizado dentro de su archivo, para que un rastreador
      # —y las vistas previas de WhatsApp o LinkedIn— vean el contenido en la
      # primera respuesta, sin ejecutar JavaScript.
      #
      # Va aqui y no en el `postbuild` porque necesita Chromium, que se instala
      # en el paso anterior y no esta en la maquina de quien programa. Y va
      # ANTES de las validaciones a proposito: asi `npm test` comprueba el HTML
      # que de verdad se publica, no uno intermedio.
      - name: Prerenderizar el cuerpo de cada ruta
        run: npm run prerender

      - name: Validar el sitio y la CSP
        run: npm test

      # cloudflare/pages-action@v1 quedó descontinuado (corría en Node 20).
      # wrangler-action@v3 es el reemplazo oficial: publica con `wrangler pages deploy`.
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=maudev --branch=${{ github.ref_name }}
