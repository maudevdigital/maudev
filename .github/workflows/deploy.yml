name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  # Nota: el deploy de preview en pull_request se quitó porque fallaba con
  # "No ref found" al borrar la rama en el merge. Producción se publica en push a main.

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Webhook de n8n para los leads del formulario (Settings → Secrets).
          # Obligatoria: ya no hay fallback. Si falta, el formulario de /contacto
          # falla explícitamente (ver src/lib/leads.js). El CTA WhatsApp no depende.
          VITE_LEAD_WEBHOOK_URL: ${{ secrets.VITE_LEAD_WEBHOOK_URL }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: maudev
          directory: dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
