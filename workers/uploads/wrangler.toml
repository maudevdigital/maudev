name = "maudev-uploads"
main = "src/index.js"
compatibility_date = "2025-05-01"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "maudev-files"

[vars]
PUBLIC_BASE_URL = "https://maudev-uploads.maudevchile.workers.dev"
ALLOWED_ORIGINS = "http://localhost:5173,https://maudev.cl,https://www.maudev.cl"

# Set the admin emails that may upload (comma-separated). Set via:
#   wrangler secret put ADMIN_EMAILS
#   wrangler secret put FIREBASE_PROJECT_ID
