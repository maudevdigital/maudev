<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark" />
    <!-- Color de la barra superior del navegador móvil según preferencia del sistema -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <script>
      // Adapta el tema (blanco/negro) al sistema del usuario y reacciona en vivo a los cambios.
      (function () {
        var mq = window.matchMedia('(prefers-color-scheme: dark)');
        var apply = function (isDark) {
          document.documentElement.classList.toggle('dark', isDark);
        };
        apply(mq.matches);
        mq.addEventListener
          ? mq.addEventListener('change', function (e) { apply(e.matches); })
          : mq.addListener(function (e) { apply(e.matches); });
      })();
    </script>
