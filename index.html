    <!-- Color de la barra superior del navegador móvil según preferencia del sistema -->
    <meta name="theme-color" content="#f9f8f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c1017" media="(prefers-color-scheme: dark)" />
    <script>
      // Tema claro/oscuro: respeta la elección manual del usuario (localStorage
      // "theme", seteado por el toggle del navbar). Si no hay elección guardada,
      // sigue al sistema y reacciona en vivo a sus cambios.
      (function () {
        var mq = window.matchMedia('(prefers-color-scheme: dark)');
        var stored = null;
        try { stored = localStorage.getItem('theme'); } catch (e) {}
        var apply = function (isDark) {
          document.documentElement.classList.toggle('dark', isDark);
        };
        apply(stored ? stored === 'dark' : mq.matches);
        var onSystemChange = function (e) {
          var saved = null;
          try { saved = localStorage.getItem('theme'); } catch (err) {}
          if (!saved) apply(e.matches);
        };
        mq.addEventListener
          ? mq.addEventListener('change', onSystemChange)
          : mq.addListener(onSystemChange);
      })();
    </script>

    <!-- Analítica (GA4 + Meta Pixel) BAJO CONSENTIMIENTO.
         Acá solo se definen los stubs: encolan llamadas en memoria, no hacen
         red ni escriben cookies. Los scripts reales (gtag.js y fbevents.js) se
         descargan únicamente cuando el visitante acepta en el banner, vía
         window.__maudevLoadAnalytics() (ver src/lib/consent.js).

         Ley 21.719: el consentimiento debe ser previo, específico e inequívoco;
         el tácito ya no vale. Por eso el default de Consent Mode es "denied". -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}

      // Google Consent Mode v2 — todo denegado hasta que el usuario acepte.
      gtag('consent', 'default', {
        analytics_storage: 'denied',
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        wait_for_update: 500
      });

      gtag('js', new Date());
      gtag('config', 'G-98P5BBFLQM', { send_page_view: false }); // page_view lo dispara React

      // Stub del Pixel: encola, no descarga. fbevents.js es quien pone _fbp.
      !function(f,b,e,v,n){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};
      if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[]}(window,document);
      fbq('init', '3002561230082800');

      // Carga real, solo bajo consentimiento. Idempotente.
      // Se mantiene el diferido por interacción/timeout para no castigar el TBT:
      // aceptar no debe empeorar la velocidad de la página.
      window.__maudevLoadAnalytics = (function(){
        var loaded = false;
        return function(){
          if (loaded) return; loaded = true;
          function inject(){
            var ga=document.createElement('script'); ga.async=true;
            ga.src='https://www.googletagmanager.com/gtag/js?id=G-98P5BBFLQM';
            document.head.appendChild(ga);
            var fb=document.createElement('script'); fb.async=true;
            fb.src='https://connect.facebook.net/en_US/fbevents.js';
            document.head.appendChild(fb);
          }
          var done=false;
          function once(){ if(done) return; done=true; inject();
            evs.forEach(function(e){window.removeEventListener(e,once)}); }
          var evs=['scroll','mousemove','touchstart','pointerdown','keydown'];
          evs.forEach(function(e){ window.addEventListener(e,once,{passive:true}); });
          setTimeout(once, 2000);
        };
      })();
    </script>
