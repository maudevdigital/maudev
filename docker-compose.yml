# n8n local — arranca con: docker compose up -d
# UI en http://localhost:5678 (usuario/clave abajo)
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=changeme
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=America/Santiago
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:

# Para exponer los webhooks a WhatsApp/Meta mientras pruebas en local:
#   docker compose exec n8n n8n start --tunnel
# o usa un túnel externo (cloudflared / ngrok) apuntando al puerto 5678.
#
# Cuando el workflow esté listo: Menú del workflow → Download (exporta el JSON)
# y súbelo al n8n de producción (otra instancia, no esta) vía Import.
